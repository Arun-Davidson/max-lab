name: CI/CD Pipeline

on:
  push:
    branches: [ main-v3 ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ Build Core Service
      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: ./core
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/core-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ✅ Deploy to EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure network exists
            docker network create HIRION-network || true

            # Pull latest Core image
            docker pull ${{ secrets.DOCKER_USERNAME }}/core-service:latest

            # Remove old Core container if exists
            docker rm -f core 2>/dev/null || true

            # Run Core container
            docker run -d --name core \
              --restart unless-stopped \
              --network="HIRION-network" \
              -p 4000:4000 \
              -e POSTGRES_HOST=pg-2a651911-bharathkumar100q-662f.e.aivencloud.com \
              -e POSTGRES_PORT=28866 \
              -e POSTGRES_DB=defaultdb \
              -e POSTGRES_USER=avnadmin \
              -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              -e REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }} \
              -e POSTGRES_SSL=true \
              -e POSTGRES_CA_CERT_PATH=./keys/ca.pem \
              -e REDIS_URL=redis://HIRION-redis:6379 \
              -e FRONTEND_ORIGINS=http://44.222.35.138,http://localhost:3000,http://localhost:5173,http://localhost:8080 \
              ${{ secrets.DOCKER_USERNAME }}/core-service:latest
