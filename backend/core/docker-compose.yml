  #   ports:
  #     - '${PORT:-4000}:${PORT:-4000}'
  #   environment:
  #     NODE_ENV: ${NODE_ENV:-development}
  #     PORT: ${PORT:-4000}
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #     POSTGRES_DB: ${POSTGRES_DB:-HIRION_clone}
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  #     JWT_ACCESS_PRIVATE_KEY_PATH: ${JWT_ACCESS_PRIVATE_KEY_PATH}
  #     JWT_ACCESS_PUBLIC_KEY_PATH: ${JWT_ACCESS_PUBLIC_KEY_PATH}
  #     JWT_REFRESH_PRIVATE_KEY_PATH: ${JWT_REFRESH_PRIVATE_KEY_PATH}
